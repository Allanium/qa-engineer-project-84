---
- summary: |
    Сайт некорректно отображается с мобильных устройств
  environment: |
    Операционная система: iOS 14.4, Android 11
    Браузеры: Safari, Chrome
    Устройства: iPhone 12 Pro, Samsung Galaxy S20 Ultra
  steps-to-reproduce: |
    1. Открыть сайт на мобильном устройстве (iPhone 12 Pro или Samsung Galaxy S20 Ultra).
  expected-result: |
    Сайт корректно отображается на мобильных устройствах, все элементы интерфейса пропорционально масштабируются и удобно размещены.
  actual-result: |
    Сайт некорректно отображается на мобильных устройствах: элементы интерфейса накладываются друг на друга, текст выходит за границы экранов.

- summary: |
    Сайт не полностью переводится на русский язык
  environment: |
    Операционная система: Windows 10
    Браузер: Yandex Версия 24.6.4.580 (64-bit)
  steps-to-reproduce: |
    1. Открыть сайт
    2. Найти переключатель языка на верхней панели
    3. Выбрать язык "Russian"
  expected-result: |
    Весь текст полностью переведен на русский язык
  actual-result: |
    Название и описание товаров, список категорий остаются на английском языке

- summary: |
    Можно добавить в корзину и заказать товар не в наличии
  environment: |
    Операционная система: Windows 10
    Браузер: Yandex Версия 24.6.4.580 (64-bit)
  steps-to-reproduce: |
    1. Открыть сайт
    2. Добавить в корзину любой товар не в наличии
    3. Оформить заказ
  expected-result: |
    Товар не в наличии нельзя добавить в корзину
  actual-result: |
    Товар добавляется в корзину, нет ошибки перед оформлением заказа

- summary: |
    Кнопка "Hexlet Store" не кликабельна
  environment: |
    Операционная система: Windows 10
    Браузер: Yandex Версия 24.6.4.580 (64-bit)
  steps-to-reproduce: |
    1. Открыть сайт
    2. Перейти в корзину
    3. Нажать кнопку "Hexlet Store"
  expected-result: |
    Пользователь возвращается на главную страницу сайта
  actual-result: |
    Кнопка не кликабельна

- summary: |
    Некорректное отображение иконки в переключателе языка
  environment: |
    Операционная система: Windows 10
    Браузер: Yandex Версия 24.6.4.580 (64-bit)
  steps-to-reproduce: |
    1. Открыть сайт
    2. Найти переключатель языка
  expected-result: |
    Иконки около английского и русского языка отображаются корректно
  actual-result: |
    Иконка около английского языка отображается неправильно
