bugreports:
  - summary: |
      Нет сообщения о пустом результате поиска
    environment: |
      Операционная система: Windows 10
      Браузер: Yandex Версия 24.6.4.580 (64-bit)
    steps-to-reproduce: |
      1. Ввести в поисковую строку название несуществующего товара
    expected-result: |
      Появляется сообщение "Nothing found!"("Ничего не найдено!")
    actual-result: |
      Показываются все товары

  - summary: |
      Некорректно работает фильтрация по цене
    environment: |
      Операционная система: Windows 10
      Браузер: Yandex Версия 24.6.4.580 (64-bit)
    steps-to-reproduce: |
      1. Выбрать диапазон цены от 10 до 100
    expected-result: |
      Отображаются товары стоимостью от 10 до 100
    actual-result: |
      Отображаются товары не из выбранного диапазона

  - summary: |
      Некорректно работает фильтрация по цене
    environment: |
